<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>X0L3KZZ DICE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;display:flex;align-items:center;justify-content:center;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#8bdced,#58c5df 58%,#a4e7ef);color:#fff}.wrap{width:min(900px,100%);padding:clamp(20px,4vw,42px);text-align:center;border:5px solid rgba(255,255,255,.78);border-radius:24px;background:rgba(25,173,208,.48);box-shadow:0 7px 0 rgba(27,139,169,.13)}h1{font-size:clamp(28px,5vw,44px);margin:0 0 34px;text-shadow:1px 2px 0 rgba(0,0,0,.1);letter-spacing:1px}.dice-area{min-height:145px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(10px,2vw,20px);margin:0 auto 30px}.die{width:clamp(66px,13vw,100px);height:clamp(66px,13vw,100px);border:7px solid rgba(255,255,255,.94);border-radius:17px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;background:#df342d;box-shadow:0 5px 9px #0002,inset 0 0 0 2px #0001;animation:land .35s ease-out}.pip{width:clamp(9px,1.8vw,14px);height:clamp(9px,1.8vw,14px);border-radius:50%;background:white;align-self:center;justify-self:center;box-shadow:0 1px 2px #7778}.p1{grid-area:1/1}.p2{grid-area:1/2}.p3{grid-area:1/3}.p4{grid-area:2/1}.p5{grid-area:2/2}.p6{grid-area:2/3}.p7{grid-area:3/1}.p8{grid-area:3/2}.p9{grid-area:3/3}@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(.82)}50%{transform:rotate(180deg) scale(1.08)}75%{transform:rotate(270deg) scale(.9)}100%{transform:rotate(360deg) scale(1)}}@keyframes land{from{transform:scale(.72) rotate(-18deg);opacity:.5}to{transform:scale(1) rotate(0);opacity:1}}.rolling .die{animation:tumble .65s ease-in-out}button{width:min(550px,100%);padding:17px 12px;border:0;border-radius:6px;background:linear-gradient(#f4ce08,#dda900);color:white;font-size:clamp(20px,3vw,25px);font-weight:900;text-shadow:1px 2px 1px #9b7b00;cursor:pointer;box-shadow:0 5px 0 #bd9300}button:active{transform:translateY(3px);box-shadow:0 2px 0 #bd9300}button:disabled{opacity:.75;cursor:wait}.caption{margin:22px 0 0;font-size:14px;color:#fff;text-shadow:0 1px 1px #178da8}
</style></head><body><main class="wrap"><h1>X0L3KZZ DICE</h1><div class="dice-area" id="diceArea" aria-live="polite"><div class="die" style="background:#df342d"><span class="pip p5"></span></div><div class="die" style="background:#e98b16"><span class="pip p1"></span><span class="pip p9"></span></div><div class="die" style="background:#389a38"><span class="pip p1"></span><span class="pip p5"></span><span class="pip p9"></span></div><div class="die" style="background:#258acb"><span class="pip p1"></span><span class="pip p3"></span><span class="pip p7"></span><span class="pip p9"></span></div></div><button id="roll">ROLL DICE</button><div class="caption">4 dice · Random colors · Every roll is different!</div></main>
<script>
const palette=['#df342d','#e98b16','#e8c20a','#389a38','#258acb','#8952b7'];const area=document.getElementById('diceArea');const button=document.getElementById('roll');const positions={1:['p5'],2:['p1','p9'],3:['p1','p5','p9'],4:['p1','p3','p7','p9'],5:['p1','p3','p5','p7','p9'],6:['p1','p3','p4','p6','p7','p9']};function roll(){button.disabled=true;area.classList.remove('rolling');void area.offsetWidth;area.classList.add('rolling');const dice=[];for(let i=0;i<4;i++){const color=palette[Math.floor(Math.random()*palette.length)];const number=1+Math.floor(Math.random()*6);dice.push({color,number});}setTimeout(()=>{area.innerHTML='';dice.forEach(d=>{const die=document.createElement('div');die.className='die';die.style.background=d.color;positions[d.number].forEach(pos=>{const pip=document.createElement('span');pip.className='pip '+pos;die.appendChild(pip);});area.appendChild(die);});area.classList.remove('rolling');button.disabled=false;},650);}button.addEventListener('click',roll);
</script></body></html>
